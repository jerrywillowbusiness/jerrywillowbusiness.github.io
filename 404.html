<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nie znaleziono strony (404)</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121416;color:#fff;font:400 1.05rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:30rem;padding:2rem}
.code{font-size:clamp(5rem,18vw,9rem);font-weight:800;line-height:1;margin:0;letter-spacing:-.03em}
h1{font-size:1.5rem;margin:.5rem 0 .75rem}
p{color:#C9CCCF;margin:0 0 1.75rem}
.links{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
a{color:#121416;background:#fff;text-decoration:none;font-weight:600;padding:.75rem 1.1rem;border-radius:999px}
a.alt{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45)}
a:hover{opacity:.88}
:focus-visible{outline:3px solid #E5BE1E;outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">404</p>
<h1>Nie ma takiej strony</h1>
<p>Adres mógł się zmienić albo zawiera literówkę.</p>
<div class="links" id="links"><a href="/">Strona główna</a></div>
</main>
<script>
if(location.pathname.startsWith('/gracus/')){
  document.title='Nie znaleziono strony – Firmy Gracusia';
  document.getElementById('links').innerHTML='<a href="/gracus/">Firmy Gracusia</a><a class="alt" href="/gracus/apartamenty/">Apartamenty</a><a class="alt" href="/gracus/wynajem/">Wynajem aut</a><a class="alt" href="/gracus/antykorozja/">Antykorozja</a>';
}
</script>
</body>
</html>
